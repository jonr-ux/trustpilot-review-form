<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Planet Tax Free Italy - Feedback</title>
    <style>
        :root {
            --planet-black: #000000;
            --planet-blue: #0076CE;
            --planet-light-gray: #f4f4f4;
            --instruction-bg: #fffbe6;
            --instruction-border: #ffe58f;
        }

        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            padding: 20px; 
            background-color: var(--planet-light-gray); 
            color: #1a1a1a;
            line-height: 1.6;
        }

        #form-container { 
            background: white; 
            padding: 40px; 
            border-radius: 0px; /* Square corporate look */
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); 
            max-width: 500px; 
            margin: 40px auto; 
            border-top: 6px solid var(--planet-black);
        }

        .logo-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .logo-header img {
            max-width: 240px;
            height: auto;
        }

        h2 { 
            color: var(--planet-black); 
            text-align: center; 
            font-size: 1.4em;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        /* Instruction for Reference ID */
        .alert-box {
            background-color: var(--instruction-bg);
            border: 1px solid var(--instruction-border);
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
            font-size: 0.9em;
            color: #856404;
        }

        .form-group { 
            margin-bottom: 22px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            font-weight: 600; 
            font-size: 0.85em;
            text-transform: uppercase;
        }

        input[type="text"], 
        input[type="email"] { 
            width: 100%; 
            padding: 14px; 
            border: 1px solid #ccc; 
            box-sizing: border-box; 
            font-size: 1em;
            transition: 0.2s;
        }

        input[type="text"]:focus, 
        input[type="email"]:focus {
            border-color: var(--planet-blue);
            outline: none;
        }

        .helper-text {
            display: block;
            margin-top: 6px;
            font-size: 0.8em;
            color: #666;
        }

        button { 
            background-color: var(--planet-black); 
            color: white; 
            padding: 18px; 
            border: none; 
            cursor: pointer; 
            font-size: 1em;
            font-weight: bold;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        button:hover { 
            background-color: var(--planet-blue); 
        }

        #iframeContainer { 
            margin-top: 20px; 
            display: none; 
            text-align: center;
            background: white;
            padding: 20px;
        }

        #reviewIframe { 
            width: 100%; 
            max-width: 900px;
            height: 1200px; 
            border: none;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div id="form-container"> 
        <div class="logo-header">
            <img src="https://i.postimg.cc/mDNTTsSz/Planet-tax-free.jpg" alt="Planet Tax Free">
        </div>

        <h2>Italy Service Review</h2>
        
        <div class="alert-box">
            <strong>Important:</strong> To ensure your review is verified correctly, please <strong>leave the Reference ID blank</strong>. Our system will generate this for you automatically.
        </div>
        
        <form id="reviewForm">
            <div class="form-group">
                <label for="customerName">Full Name</label>
                <input type="text" id="customerName" name="customerName" placeholder="Enter your name" required>
            </div>
            
            <div class="form-group">
                <label for="customerEmail">Email Address</label>
                <input type="email" id="customerEmail" name="customerEmail" placeholder="your@email.com" required>
            </div>
            
            <div class="form-group">
                <label for="referenceId">Reference ID (Auto-Generated)</label>
                <input type="text" id="referenceId" name="referenceId" placeholder="DO NOT FILL - LEAVE BLANK">
                <span class="helper-text">Leave this field empty to use an auto-generated ID.</span>
            </div>
            
            <button type="submit">Begin Your Review</button>
        </form>
    </div>

    <div id="iframeContainer">
        <iframe id="reviewIframe" frameborder="0" allowfullscreen></iframe>
    </div>

    <script>
        // --- Configuration ---
        const DOMAIN_NAME = "premium.bundingo.com";
        const SECRET_KEY = "pt$u1>&EplNfWu89&WQAA3YAedT=Y(?t"; 
        const BASE_URL = `https://www.trustpilot.com/evaluate/embed/${DOMAIN_NAME}`;

        function generateRandomRefId() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        async function sha1(str) {
            const buffer = new TextEncoder("utf-8").encode(str);
            const hash = await crypto.subtle.digest("SHA-1", buffer);
            const hexCodes = [];
            new Uint8Array(hash).forEach(byte => {
                hexCodes.push(byte.toString(16).padStart(2, '0'));
            });
            return hexCodes.join('');
        }

        document.getElementById('reviewForm').addEventListener('submit', async function(event) {
            event.preventDefault();

            const name = document.getElementById('customerName').value.trim();
            let email = document.getElementById('customerEmail').value.trim().toLowerCase(); 
            let ref = document.getElementById('referenceId').value.trim(); 

            // Auto-population logic
            if (!ref) {
                ref = 'IT-' + generateRandomRefId(); 
            }
            
            let b_email = btoa(email).replace(/=+$/, ''); 
            const c_name = encodeURIComponent(name);
            const hashString = SECRET_KEY + email + ref;
            const e_hash = await sha1(hashString); 

            const uniqueURL = `${BASE_URL}?a=${ref}&b=${b_email}&c=${c_name}&e=${e_hash}`;

            document.getElementById('form-container').style.display = 'none';
            document.getElementById('iframeContainer').style.display = 'block';

            const iframe = document.getElementById('reviewIframe');
            iframe.src = uniqueURL;
        });
    </script>

</body>
</html>
